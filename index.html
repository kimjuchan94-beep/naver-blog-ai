<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 네이버 블로그 생성기 (모바일 업로드 수정)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.5; padding: 10px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 20px; color: #03c75a; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #555; font-size: 14px; }
        input[type="password"], textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        
        /* 모바일 터치 최적화 버튼형 업로드 영역 */
        .upload-btn-label { 
            display: block; 
            border: 2px dashed #03c75a; 
            padding: 35px 15px; 
            text-align: center; 
            border-radius: 8px; 
            cursor: pointer; 
            background: #fafafa; 
            color: #03c75a; 
            font-weight: bold;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .upload-btn-label:active { background: #e8f7ee; }

        #imageFile { display: none; }
        
        /* 이미지 미리보기 갤러리 */
        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .preview-item {
            position: relative;
            width: 75px;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #ddd;
            background-color: #eee;
            flex-shrink: 0;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .badge {
            position: absolute;
            bottom: 3px;
            left: 3px;
            background: rgba(3, 199, 90, 0.9);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
        }
        .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        button.main-btn { background-color: #03c75a; color: white; border: none; padding: 14px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button.main-btn:active { background-color: #029443; }
        
        .result-box { margin-top: 25px; border-top: 2px solid #eee; padding-top: 15px; }
        .result-content { background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; white-space: pre-wrap; min-height: 180px; font-size: 13px; line-height: 1.6; }
        .copy-btn { margin-top: 10px; background-color: #333; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📸 AI 네이버 블로그 생성기</h1>
    
    <!-- API 키 입력 -->
    <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="API 키를 입력하세요">
    </div>

    <!-- 이미지 업로드 (모바일 완벽 호환 레이블 연결 방식) -->
    <div class="form-group">
        <label>사진 업로드 (여러 장 가능)</label>
        <label for="imageFile" class="upload-btn-label" id="uploadLabel">
            📂 터치해서 사진 여러 장 선택하기
        </label>
        <input type="file" id="imageFile" accept="image/*" multiple>
        <div class="preview-container" id="previewContainer"></div>
    </div>

    <!-- 추가 요구사항 -->
    <div class="form-group">
        <label for="prompt">추가 요청사항 및 키워드 (선택)</label>
        <textarea id="prompt" rows="3" placeholder="예: 맛집 리뷰, 친절한 어조. Key: 화정동 맛집"></textarea>
    </div>

    <button class="main-btn" onclick="generateBlog()">AI 블로그 포스팅 생성하기 🚀</button>

    <!-- 결과 영역 -->
    <div class="result-box" id="resultArea" style="display:none;">
        <label>생성된 블로그 글 (사진 위치 포함)</label>
        <div class="result-content" id="output"></div>
        <button class="copy-btn" onclick="copyResult()">내용 복사하기</button>
    </div>
</div>

<script>
    let imageList = [];

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('my_gemini_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }

        // 파일 선택 시 이벤트 처리
        const imageInput = document.getElementById('imageFile');
        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFiles(e.target.files);
                imageInput.value = ''; // 초기화하여 같은 사진 재선택 허용
            }
        });
    });

    function handleFiles(files) {
        Array.from(files).forEach(file => {
            if (!file.type.startsWith('image/')) {
                alert(`${file.name} 은(는) 이미지 파일이 아닙니다.`);
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result.split(',')[1];
                imageList.push({
                    name: file.name,
                    mimeType: file.type,
                    base64: base64Data,
                    previewUrl: event.target.result
                });
                renderPreviews();
            };
            reader.readAsDataURL(file);
        });
    }

    function renderPreviews() {
        const container = document.getElementById('previewContainer');
        const uploadLabel = document.getElementById('uploadLabel');
        container.innerHTML = '';

        imageList.forEach((img, index) => {
            const item = document.createElement('div');
            item.className = 'preview-item';
            item.innerHTML = `
                <img src="${img.previewUrl}" alt="미리보기">
                <div class="badge">${index + 1}번</div>
                <button class="remove-btn" type="button" onclick="removeImage(${index})">✕</button>
            `;
            container.appendChild(item);
        });

        if (imageList.length > 0) {
            uploadLabel.innerText = `총 ${imageList.length}장의 사진 선택됨 (터치하여 추가 선택)`;
        } else {
            uploadLabel.innerText = '📂 터치해서 사진 여러 장 선택하기';
        }
    }

    function removeImage(index) {
        imageList.splice(index, 1);
        renderPreviews();
    }

    async function generateBlog() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const userPrompt = document.getElementById('prompt').value.trim();
        const outputDiv = document.getElementById('output');
        const resultArea = document.getElementById('resultArea');

        if (!apiKey) {
            alert("Gemini API 키를 입력해주세요!");
            return;
        }
        if (imageList.length === 0) {
            alert("블로그에 쓸 사진을 1장 이상 업로드해주세요!");
            return;
        }

        localStorage.setItem('my_gemini_key', apiKey);

        outputDiv.innerText = `🤖 모바일에서 ${imageList.length}장의 사진을 분석하고 글을 작성 중입니다... 잠시만 기다려주세요!`;
        resultArea.style.display = 'block';

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

        const systemInstruction = `당신은 네이버 블로그 검색 알고리즘(C-Rank, 다이아+)의 특성을 완벽히 이해하고 상위 노출을 밥 먹듯이 하는 5년 차 베테랑 파워블로거입니다. 
글을 작성하기 전, 반드시 다음 [저품질 회피 및 사진 배치 가이드라인]을 엄격하게 준수하여 글을 작성하세요.

[저품질 회피 및 사진 배치 가이드라인]
1. 사진 위치 매칭 표시: 업로드된 사진들의 순서(1번, 2번...)에 맞춰, 본문 내용 중 해당 사진에 대한 설명이 나오는 흐름에 맞게 **[사진 1 위치]**, **[사진 2 위치]** 처럼 정확한 번호로 가이드 표시를 문단 사이에 반드시 삽입하세요.
2. AI 티 절대 안 내기: "안녕하세요! 오늘은 ~에 대해 알아보겠습니다" 같은 전형적인 기계어, 딱딱한 문어체, 과도한 이모지 반복을 절대 금지합니다.
3. 완벽한 구어체 사용: 실제 사람이 혼잣말을 하듯, 혹은 친구에게 톡을 보내듯 자연스러운 어조(~더라고요, ~했음!, ~강추함 등)를 사용하세요.
4. 경험 중심 스토리텔링: 사진 속 디테일(조명, 분위기, 맛, 크기 등)을 바탕으로 '내가 직접 돈을 주고 경험한 생생한 후기' 느낌을 극대화하세요.
5. 체류 시간 확보: 단순 정보 나열이 아니라, 독자들이 궁금해할 만한 소소한 꿀팁(예: 주차 팁, 웨이팅 피하는 법 등)을 문맥 속에 자연스럽게 녹여내세요.
6. 해시태그: 하단에 검색 유입에 도움이 되는 트렌디하고 실효성 있는 해시태그 5~7개를 필수로 남겨주세요.`;

        const parts = [{ text: systemInstruction + "\n\n사용자 추가 요청사항: " + userPrompt }];
        
        imageList.forEach((img, i) => {
            parts.push({ text: `\n[사진 ${i + 1}번]` });
            parts.push({
                inline_data: {
                    mime_type: img.mimeType,
                    data: img.base64
                }
            });
        });

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts }] })
            });

            const data = await response.json();

            if (data.candidates && data.candidates[0].content) {
                const text = data.candidates[0].content.parts[0].text;
                outputDiv.innerText = text;
            } else {
                outputDiv.innerText = "오류가 발생했습니다: " + JSON.stringify(data);
            }
        } catch (error) {
            outputDiv.innerText = "통신 중 에러가 발생했습니다: " + error.message;
        }
    }

    function copyResult() {
        const text = document.getElementById('output').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("블로그 내용이 복사되었습니다! 네이버 블로그에 붙여넣기 하세요.");
        });
    }
</script>

</body>
</html>
